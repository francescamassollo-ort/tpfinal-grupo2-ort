  # 4.11.0 no compila. Se puede quitar al actualizar pdf (3.13 pide Flutter 3.44).
  image: ">=4.1.0 <4.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
