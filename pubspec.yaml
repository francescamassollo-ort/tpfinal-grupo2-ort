publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cloud_firestore: ^7.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  pdf: ">=3.12.0 <3.13.0"
